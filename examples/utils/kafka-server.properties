# Apache Kafka 4.3 broker config, KRaft combined broker + controller,
# single node for tests.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

# Listeners
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# Logs
log.dirs=/tmp/kafka-logs
num.partitions=1
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Test correctness: tests assert that reading from a missing topic raises;
# this requires the broker NOT to silently auto-create on first reference.
auto.create.topics.enable=false

# Single-node sanity
group.initial.rebalance.delay.ms=0
